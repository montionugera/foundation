name: ARM

on:
  pull_request:
  merge_group:
  push:
    branches: [main]
    paths:
      - 'crates/**'
      - 'bench/**'
      - 'fuzz/**'
      - 'xtask/**'
      - 'oracles/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.cargo/**'
      - 'rust-toolchain*'
      - 'clippy.toml'
      - 'rustfmt.toml'
      - 'deny.toml'
      - 'docs/quickstart.md'
      - '.github/workflows/**'

# On main each run ends, and only the newest waiting commit runs next.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # A trigger path filter leaves a required check pending, and a skipped one passes. So
  # `test` skips only when this filter ran and found no change. A merge queue push skips
  # `test`, because the queue already ran it on the same commit.
  changes:
    if: github.event_name != 'push' || github.actor == 'github-merge-queue[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      code: ${{ github.event_name == 'push' && 'false' || steps.filter.outputs.code }}
    steps:
      # In the merge queue, the filter diffs the group's base and head in a clone.
      - if: github.event_name == 'merge_group'
        uses: actions/checkout@v4
      - if: github.event_name != 'push'
        uses: dorny/paths-filter@0e4a8c6effa4802afeda77dc8d303f8176d7dfad # v3.0.4
        id: filter
        with:
          base: ${{ github.event.merge_group.base_sha }}
          ref: ${{ github.event.merge_group.head_sha }}
          filters: |
            code:
              - 'crates/**'
              - 'bench/**'
              - 'fuzz/**'
              - 'xtask/**'
              - 'oracles/**'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - '.cargo/**'
              - 'rust-toolchain*'
              - 'clippy.toml'
              - 'rustfmt.toml'
              - 'deny.toml'
              - 'docs/quickstart.md'
              - '.github/workflows/**'

  test:
    needs: changes
    if: "!cancelled() && needs.changes.outputs.code != 'false'"
    runs-on: [self-hosted, Linux, ARM64]
    # Each host runs one runner for each 2.7 vCPU and 10.7 GiB. At the CPU count of the
    # host, the builds of its runners at once need more memory than it has (#2719).
    env:
      CARGO_BUILD_JOBS: 3
    steps:
      - uses: actions/checkout@v4
      - name: Add cargo to the path
        run: echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
      # Outside the workspace, so checkout keeps it. One job runs on a runner at a
      # time, so each runner owns its directory.
      - name: Keep the build
        run: |
          dir="$HOME/target/$RUNNER_NAME"
          if [ -d "$dir" ] && [ "$(du -sk "$dir" | cut -f1)" -gt $((25 * 1024 * 1024)) ]
          then
            rm -rf "$dir"
          fi
          echo "CARGO_TARGET_DIR=$dir" >> "$GITHUB_ENV"
      - name: Test
        run: cargo test --workspace

  # Temporary (#2719): the peak memory of one clean build at each job count, six at once.
  peak:
    if: github.event_name == 'pull_request'
    name: peak ${{ matrix.jobs }} (${{ matrix.copy }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - { jobs: 16, copy: a }
          - { jobs: 4, copy: a }
          - { jobs: 3, copy: a }
          - { jobs: 3, copy: b }
          - { jobs: 3, copy: c }
          - { jobs: 3, copy: d }
    runs-on: [self-hosted, Linux, ARM64]
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - name: Add cargo to the path
        run: echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
      - name: Build from an empty target directory
        env:
          CARGO_BUILD_JOBS: ${{ matrix.jobs }}
          CARGO_TARGET_DIR: ${{ runner.temp }}/peak-target
        run: |
          c=/sys/fs/cgroup$(cut -d: -f3 /proc/self/cgroup)
          unit=${c##*/}
          echo "runner $RUNNER_NAME, unit $unit, jobs $CARGO_BUILD_JOBS"
          echo "MemoryMax $(systemctl show -p MemoryMax --value "$unit")"
          grep -E '^(MemTotal|MemAvailable):' /proc/meminfo
          nproc
          kills=$(awk '$1 == "oom_kill" {print $2}' "$c/memory.events")
          rm -rf "$CARGO_TARGET_DIR"
          while sleep 1; do
            echo "$(cat "$c/memory.current") \
              $(awk '/^MemAvailable:/ {print $2}' /proc/meminfo)"
          done > "$RUNNER_TEMP/memory" &
          sampler=$!
          start=$(date +%s)
          status=0
          cargo test --workspace --no-run || status=$?
          kill "$sampler"
          echo "exit $status after $(( $(date +%s) - start )) s"
          echo "oom_kill $(( $(awk '$1 == "oom_kill" {print $2}' "$c/memory.events") - kills ))"
          echo "unit peak $(cut -d' ' -f1 "$RUNNER_TEMP/memory" | sort -n | tail -1) B"
          echo "host MemAvailable low $(awk '{print $2}' "$RUNNER_TEMP/memory" | sort -n | head -1) KiB"
          rm -rf "$CARGO_TARGET_DIR"
          exit "$status"
