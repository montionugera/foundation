name: CI

on:
  pull_request:
  merge_group:
  push:
    branches: [main]
    paths:
      - 'crates/**'
      - 'bench/**'
      - 'fuzz/**'
      - 'xtask/**'
      - 'sdk/**'
      - 'oracles/**'
      - 'patches/**'
      - 'Cargo.toml'
      - '**/Cargo.toml'
      - 'Cargo.lock'
      - '.cargo/**'
      - 'rust-toolchain*'
      - 'clippy.toml'
      - 'rustfmt.toml'
      - 'deny.toml'
      - 'docs/quickstart.md'
      - '.github/workflows/**'

# Each commit on main gets its own group, so a later merge never cancels its run.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref == 'refs/heads/main' && github.sha || github.ref }}
  cancel-in-progress: true

jobs:
  # A skipped required job counts as passed. So a job skips only when this filter ran
  # and found no change. A direct push or a failed filter runs every job. A merge queue
  # push skips every job, because the queue already ran them on the same commit.
  changes:
    if: github.event_name != 'push' || github.actor == 'github-merge-queue[bot]'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pull-requests: read
    outputs:
      rust: >-
        ${{ github.event_name == 'push' && 'false' || steps.filter.outputs.rust }}
      deps: >-
        ${{ github.event_name == 'push' && 'false' || steps.filter.outputs.deps }}
      models: >-
        ${{ github.event_name == 'push' && 'false' || steps.filter.outputs.models }}
      wait: >-
        ${{ github.event_name == 'push' && 'false' || steps.filter.outputs.wait }}
    steps:
      # In the merge queue, the filter diffs the group's base and head in a clone.
      - if: github.event_name == 'merge_group'
        uses: actions/checkout@v4
      - if: github.event_name != 'push'
        uses: dorny/paths-filter@0e4a8c6effa4802afeda77dc8d303f8176d7dfad # v3.0.4
        id: filter
        with:
          base: ${{ github.event.merge_group.base_sha }}
          ref: ${{ github.event.merge_group.head_sha }}
          filters: |
            rust:
              - 'crates/**'
              - 'bench/**'
              - 'fuzz/**'
              - 'xtask/**'
              - 'sdk/**'
              - 'oracles/**'
              - 'patches/**'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - '.cargo/**'
              - 'rust-toolchain*'
              - 'clippy.toml'
              - 'rustfmt.toml'
              - 'deny.toml'
              - 'docs/quickstart.md'
              - '.github/workflows/**'
            deps:
              - 'Cargo.toml'
              - '**/Cargo.toml'
              - 'Cargo.lock'
              - 'fuzz/Cargo.lock'
              - 'deny.toml'
              - '.github/workflows/**'
            models:
              - 'crates/ring/**'
              - 'crates/block/**'
              - 'crates/counting/**'
              - 'crates/waker/**'
              - 'crates/env/**'
              - 'crates/types/**'
              - 'crates/node/**'
              - 'crates/connector/**'
              - 'crates/connector-ni/**'
              - 'crates/daqmx-stub/**'
              - 'xtask/**'
              - 'Cargo.lock'
              - '.cargo/**'
              - 'rust-toolchain*'
              - '.github/workflows/**'
            wait:
              - '.claude/skills/build/wait.sh'
              - '.claude/skills/build/wait_test.sh'
              - '.github/workflows/**'

  # The required checks `check`, `macos`, and `windows`, one for each OS of LINUX CI.
  # A matrix job that skips reports one check named by the unexpanded expression, so
  # this job always runs, and each step skips when the filter found no change.
  check:
    needs: changes
    if: "!cancelled()"
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        # Each OS lists the flags that leave out what fails on it, each with the open
        # issue that removes it: `crates` do not build with all their targets, the tests
        # of `untested` fail, and so do `tests`, each a full test path that `--exact`
        # matches in its binary. The lists only shrink, other than a new crate with the
        # open issues of the `os` items that it needs (LINUX CI).
        include:
          - name: check
            runner: ubuntu-24.04
            crates: []
            untested: []
            tests: []
          - name: macos
            runner: macos-15
            crates: []
            untested: []
            tests:
              - --skip wall::gives_a_bound_under_sixteen_seconds_when_a_daemon_runs # #2965
              - --skip daqmx::tests::names_a_library_that_does_not_load # #3033
              - --skip daqmx::tests::names_a_function_the_library_lacks # #3033
              - --skip link::the_c_names_only_the_listed_symbols_outside_it # #3025
              - --skip link::the_shim_draws_nothing_from_the_generator_of_the_copy # #3025
              - --skip link::the_shim_names_no_libcrypto # #3025
              - --skip link::the_tests_reach_neither_interrupt_server_nor_random_seed # #3025
              - --skip link::the_c_and_cfg_asan_follow_the_address_sanitizer_of_the_rust # #3025
              - --skip link::the_c_on_64_bit_arm_names_only_the_listed_symbols_outside_it # #3025
              - --skip link::the_copy_copies_floats_as_they_lie_in_memory_on_little_endian_targets # #3025
              - --skip rig::a_test_that_panics_kills_its_command # #3034
              - --skip rig::a_failed_kill_panics # #3034
              - --skip rig::a_failed_kill_while_the_test_panics_with_a_closed_stderr_does_not_abort # #3034
              - --skip rig::a_failed_kill_while_the_test_panics_reports_its_error # #3034
              - --skip rig::a_failed_kill_panics_in_a_run_that_does_not_capture # #3034
              - --skip one_node::sim::a_stopped_influx_refuses_and_serves_again_on_its_port_with_what_it_stored # #3035
              - --skip one_node::sim::a_dropped_opcua_stops_each_server_that_it_served # #3035
              - --skip one_node::sim::a_dropped_influx_stops_its_server_when_the_test_panics # #3035
              - --skip one_node::a_wrong_endpoint_shows_in_status_and_heals # #3035
              - --skip no_child_holds_a_socket_that_another_thread_opens # #3036
              - --skip no_child_holds_a_socket_of_a_lookup # #3036
              - --skip a_dropped_listener_refuses_while_a_copy_of_it_is_open # #3036
              - --skip a_listener_with_a_failed_registration_refuses_while_a_copy_is_open # #3036
              - --skip start::a_kept_pool_budget_too_large_for_the_host_fails_with_no_panic # #3043
              - --skip start::a_kept_pool_budget_that_the_system_cannot_reserve_fails # #3043
              - --skip open62541::tests::check_refuses_a_line_directive_in_the_copy # #3041
              - --skip open62541::tests::run_copies_each_compiled_source_and_its_headers # #3041
              - --skip open62541::tests::run_refuses_a_release_with_no_file_of_extra # #3041
              - --skip open62541::tests::run_refuses_a_file_of_extra_that_the_library_holds # #3041
              - --skip open62541::tests::run_refuses_each_problem_of_the_staged_copy # #3041
              - --skip open62541::tests::run_names_a_static_helper_that_calls_a_clock # #3041
              - --skip open62541::tests::run_refuses_a_source_with_other_flags # #3041
              - --skip open62541::tests::run_refuses_a_flag_in_no_list # #3041
              - --skip open62541::tests::run_copies_a_source_whose_name_starts_with_a_dash # #3041
              - --skip open62541::tests::run_names_a_clock_call_in_a_source_whose_name_starts_with_an_at_sign # #3041
              - --skip open62541::tests::run_keeps_the_copy_when_a_file_is_missing # #3041
              - --skip open62541::tests::check_finds_a_clock_call_added_to_the_copy # #3041
              - --skip open62541::tests::check_finds_a_builtin_and_an_asm_statement_that_read_a_clock # #3041
              - --skip open62541::tests::check_finds_an_os_call_through_a_header_that_includes_its_own # #3041
              - --skip open62541::tests::check_finds_an_os_call_whose_name_another_file_defines_as_static # #3041
              - --skip open62541::tests::check_finds_a_read_of_errno_that_no_call_of_the_copy_set # #3041
              - --skip open62541::tests::check_finds_a_listed_symbol_at_a_place_that_the_list_does_not_name # #3041
              - --skip open62541::tests::check_finds_a_listed_symbol_in_a_nested_function_of_a_new_function # #3041
              - --skip open62541::tests::check_finds_the_address_of_a_listed_symbol_in_its_function # #3041
              - --skip open62541::tests::check_reads_each_name_to_its_end # #3041
              - --skip open62541::tests::check_refuses_an_odd_name_that_looks_like_a_mapping_symbol # #3041
              - --skip open62541::tests::check_fails_on_a_c_identifier_that_holds_a_dollar # #3041
              - --skip open62541::tests::check_reads_the_symbols_that_a_build_with_the_flags_of_the_copy_gives # #3041
              - --skip open62541::tests::check_passes_an_undefined_symbol_that_no_relocation_names # #3041
              - --skip open62541::tests::check_finds_a_read_of_the_table_of_the_linker_that_the_c_makes # #3041
              - --skip open62541::tests::check_finds_a_clock_call_that_a_listed_function_inlines # #3041
              - --skip open62541::tests::check_passes_on_the_committed_copy # #3041
              - --skip open62541::tests::each_thread_of_the_committed_copy_draws_from_its_own_random_state_or_aborts # #3041
              - --skip open62541::tests::run_refuses_a_file_of_omitted_that_the_library_does_not_compile # #3041
              - --skip open62541::tests::check_builds_against_the_headers_of_the_crypto # #3041
              - --skip open62541::tests::check_finds_a_read_of_the_committed_copy_that_gives_aws_lc_no_callback # #3041
              - --skip open62541::tests::check_fails_a_read_of_the_copy_with_no_declaration # #3041
              - --skip open62541::tests::check_fails_a_read_of_aws_lc_with_no_declaration # #3041
              - --skip open62541::tests::check_finds_a_read_of_the_copy_with_its_own_declaration # #3041
              - --skip open62541::tests::check_finds_a_read_under_a_macro_of_pem_h # #3041
              - --skip open62541::tests::check_finds_a_read_past_a_pem_h_of_the_copy # #3041
              - --skip pem::each_read_refuses_an_encrypted_pem_with_no_prompt # #3070
              - --skip child::a_detached_child_that_reads_no_stdin_gives_its_output # #3070
          - name: windows
            runner: windows-2025
            crates:
              - --exclude connector-opcua # #2968
              - --exclude node # #2968, #682, #2955, #2956, #477, #2957
              - --exclude acceptance # #2968, #682, #2955, #2956, #477, #2957
              - --exclude xtask # #2238
              - --exclude ops # #2971
              - --exclude sdk # #682, #2955
              - --exclude sdk-python # #682, #2955
            untested:
              - --exclude sim # #2973
              - --exclude secret # #2973
              - --exclude connector-influx # #2973
            tests:
              - --skip kind::tests::reads_a_secret_at_each_call_and_retries_one_the_store_has_not # #2973
              - --skip supervisor::tests::heals_a_run_when_a_secret_file_too_large_is_cut # #2973
              - --skip supervisor::tests::heals_a_run_when_the_missing_secret_is_written # #2973
              - --skip browse::gives_a_secret_that_is_not_there_as_a_retry # #2973
              - --skip driver::tests::home::set_home_gives_the_cause_when_the_write_of_its_entry_stops_the_group # #2973
              - --skip driver::tests::in_use::an_open_refuses_a_file_that_does_not_name_a_pointer # #2973
              - --skip driver::tests::serve::serve_gives_no_code_of_the_mesh_when_the_group_stops # #2973
              - --skip log::tests::a_second_open_gives_busy_on_the_lock_while_the_first_log_lives # #2973
              - --skip log::tests::refuses_a_bad_record_with_a_good_one_after_it # #2973
              - --skip log::tests::refuses_a_file_that_is_not_the_next_log_file # #2973
              - --skip log::tests::refuses_a_lock_that_has_bytes # #2973
              - --skip log::tests::refuses_a_record_of_another_format_version # #2973
              - --skip log::tests::refuses_a_write_after_a_failed_or_dropped_one # #2973
              - --skip daqmx::tests::names_a_library_that_does_not_load # #3033
              - --skip daqmx::tests::names_a_function_the_library_lacks # #3033
    runs-on: ${{ matrix.runner }}
    env:
      RUST: ${{ needs.changes.outputs.rust }}
    defaults:
      run:
        shell: bash
    steps:
      - if: env.RUST != 'false'
        uses: actions/checkout@v4
      - if: env.RUST != 'false'
        uses: Swatinem/rust-cache@v2
      # The tests of `sdk-python` embed CPython 3.11 or later, which needs its shared
      # library, and start the node at `FOUNDATION_NODE`, which `Test` builds for the
      # tests of `node`. Windows builds no node (#2968, #682, #2955, #2956, #477, #2957).
      - if: env.RUST != 'false' && runner.os != 'Windows'
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - if: env.RUST != 'false' && runner.os != 'Windows'
        run: |
          echo "PYO3_PYTHON=$(command -v python)" >> "$GITHUB_ENV"
          echo "FOUNDATION_NODE=$PWD/target/debug/foundation" >> "$GITHUB_ENV"
      - name: Format
        if: env.RUST != 'false' && runner.os == 'Linux'
        run: |
          cargo fmt --check
          cargo fmt --check --manifest-path fuzz/Cargo.toml
      - name: Clippy
        if: "!cancelled() && env.RUST != 'false'"
        run: >-
          cargo clippy --workspace ${{ join(matrix.crates, ' ') }} --all-targets
          --all-features --keep-going -- -D warnings
      - name: Layers
        if: "!cancelled() && env.RUST != 'false' && runner.os == 'Linux'"
        run: cargo xtask layers
      - name: Globals
        if: "!cancelled() && env.RUST != 'false' && runner.os == 'Linux'"
        run: cargo xtask globals
      - name: Skips
        if: "!cancelled() && env.RUST != 'false' && runner.os == 'Linux'"
        run: cargo xtask skips
      - name: Oracles
        if: "!cancelled() && env.RUST != 'false' && runner.os == 'Linux'"
        run: cargo xtask oracles
      - name: Test
        if: "!cancelled() && env.RUST != 'false'"
        run: >-
          cargo test --workspace ${{ join(matrix.crates, ' ') }}
          ${{ join(matrix.untested, ' ') }} --all-features --no-fail-fast
          -- --exact ${{ join(matrix.tests, ' ') }}
      # Root tests mount a filesystem. Only this runner, which is discarded after the
      # job, runs them.
      - name: Root tests
        if: "!cancelled() && env.RUST != 'false' && runner.os == 'Linux'"
        run: |
          cargo clippy -p os --all-features --test root -- -D warnings
          cargo test -p os --all-features --test root

  # The required checks `features`, `features-macos`, and `features-windows`. It runs
  # as `check` does, and each OS leaves out the `crates` of its entry of `check`.
  features:
    needs: changes
    if: "!cancelled()"
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: features
            runner: ubuntu-24.04
            crates: []
          - name: features-macos
            runner: macos-15
            crates: []
          - name: features-windows
            runner: windows-2025
            crates:
              - --exclude connector-opcua # #2968
              - --exclude node # #2968, #682, #2955, #2956, #477, #2957
              - --exclude acceptance # #2968, #682, #2955, #2956, #477, #2957
              - --exclude xtask # #2238
              - --exclude ops # #2971
              - --exclude sdk # #682, #2955
              - --exclude sdk-python # #682, #2955
    runs-on: ${{ matrix.runner }}
    env:
      RUST: ${{ needs.changes.outputs.rust }}
    defaults:
      run:
        shell: bash
    steps:
      - if: env.RUST != 'false'
        uses: actions/checkout@v4
      - if: env.RUST != 'false'
        uses: Swatinem/rust-cache@v2
      - if: env.RUST != 'false'
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-hack@0.6.45
      - name: Each feature alone
        if: env.RUST != 'false'
        run: >-
          cargo hack check --workspace ${{ join(matrix.crates, ' ') }} --each-feature
          --no-dev-deps

  deny:
    needs: changes
    if: "!cancelled() && needs.changes.outputs.deps != 'false'"
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny@0.20.2
      # `fuzz/` is a workspace of its own, with its own lock file.
      - name: Dependencies
        run: |
          cargo deny check advisories bans licenses sources
          cargo deny --manifest-path fuzz/Cargo.toml \
            check advisories bans licenses sources
      # A patched crate is a path package, which no advisory reaches. A package that
      # depends on the exact release of each path package outside the workspace
      # checks those releases.
      - name: Advisories of each patched release
        shell: bash
        run: |
          dir="$RUNNER_TEMP/patched"
          mkdir -p "$dir/src" && touch "$dir/src/lib.rs"
          {
            printf '[package]\nname = "patched"\nversion = "0.0.0"\nedition = "2024"\n'
            printf '\n[workspace]\n\n[dependencies]\n'
            cargo metadata --format-version 1 --locked | jq -r '.workspace_members as $m
              | .packages[] | select(.source == null and (.id | IN($m[]) | not))
              | "\(.name) = \"=\(.version)\""'
          } > "$dir/Cargo.toml"
          cargo deny --manifest-path "$dir/Cargo.toml" --config deny.toml \
            check advisories

  wait:
    needs: changes
    if: "!cancelled() && needs.changes.outputs.wait != 'false'"
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v4
      # The last cases read merged #1428 through the API.
      - name: Wait script
        env:
          GH_TOKEN: ${{ github.token }}
        run: sh .claude/skills/build/wait_test.sh

  loom:
    needs: changes
    if: "!cancelled() && needs.changes.outputs.models != 'false'"
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
      - name: Clippy
        run: cargo clippy -p ring -p block --all-targets -- -D warnings
        env:
          RUSTFLAGS: --cfg loom
      - name: Loom
        run: cargo xtask loom

  shuttle:
    needs: changes
    if: "!cancelled() && needs.changes.outputs.models != 'false'"
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
      - name: Shuttle
        run: cargo xtask shuttle

  # Each shard runs an eighth of the Miri tests.
  miri-shard:
    needs: changes
    if: "!cancelled() && needs.changes.outputs.models != 'false'"
    name: miri shard ${{ matrix.kind }} ${{ matrix.shard }}
    strategy:
      fail-fast: false
      matrix:
        kind: [count, hash, slice]
        shard: [0, 1, 2, 3, 4, 5, 6, 7]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install the pinned nightly
        run: |
          rustup toolchain install "$(cat rust-toolchain-nightly)" --profile minimal \
            --component miri,rust-src
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest@0.9.146
      - uses: Swatinem/rust-cache@v2
      - name: Miri
        env:
          SHARD: ${{ matrix.shard }}
          MIRI_PARTITION: ${{ matrix.kind }}
        run: cargo xtask miri "$SHARD/8"

  # The required check. It passes when each shard passed.
  miri:
    needs: [changes, miri-shard]
    if: "!cancelled() && needs.changes.outputs.models != 'false'"
    runs-on: ubuntu-24.04
    steps:
      - name: The result of the shards
        env:
          RESULT: ${{ needs.miri-shard.result }}
        run: |
          [ "$RESULT" = success ] ||
            { echo "::error::The miri shards ended in $RESULT."; exit 1; }

  # Miri cannot run C, so ASan and UBSan check `connector-opcua` in its place.
  sanitizers:
    needs: changes
    if: "!cancelled() && needs.changes.outputs.rust != 'false'"
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install the pinned nightly
        run: |
          rustup toolchain install "$(cat rust-toolchain-nightly)" --profile minimal
      - uses: Swatinem/rust-cache@v2
      - name: Sanitizers
        run: cargo xtask sanitizers

  fuzz:
    needs: changes
    if: "!cancelled() && needs.changes.outputs.rust != 'false'"
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install the pinned nightly
        run: |
          rustup toolchain install "$(cat rust-toolchain-nightly)" --profile minimal
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            . -> target
            fuzz -> target
      - name: Read the cargo-fuzz pin
        id: cargo-fuzz
        run: echo "tool=cargo-fuzz@$(cat fuzz/cargo-fuzz-version)" >> "$GITHUB_OUTPUT"
      - uses: taiki-e/install-action@v2
        with:
          tool: ${{ steps.cargo-fuzz.outputs.tool }}
      # `fuzz/` is a workspace of its own, which the Clippy step of `check` does not
      # see.
      - name: Clippy
        run: cargo clippy --manifest-path fuzz/Cargo.toml --all-targets -- -D warnings
      - name: Fuzz
        if: ${{ !cancelled() }}
        run: cargo xtask fuzz 60
      - name: Clean tree
        run: test -z "$(git status --porcelain)" || { git status; exit 1; }
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-artifacts
          path: fuzz/artifacts
          if-no-files-found: ignore

  mutants-shard:
    needs: changes
    if: >-
      !cancelled() && needs.changes.outputs.rust != 'false' &&
      github.event_name == 'pull_request'
    # A mutant that hangs runs until its timeout, so the run needs parallel jobs. Each
    # shard runs an eighth of the mutants, round robin, on its own hosted 4-core VM,
    # which no other job shares (#2726). The rule that a missed mutant fails CI is in
    # `docs/claude/testing.md`.
    name: mutants shard ${{ matrix.shard }}
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3, 4, 5, 6, 7]
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: Swatinem/rust-cache@v2
        with:
          # cargo-mutants builds in copies of the tree, never in its `target`.
          cache-targets: false
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-mutants@27.1.0
      # As in `check`. cargo-mutants runs only the tests of the mutated crate, so only a
      # shard with a mutant in `sdk/python` builds the node.
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Node
        env:
          SHARD: ${{ matrix.shard }}
        run: |
          git diff origin/main...HEAD > "$RUNNER_TEMP/diff.patch"
          echo "PYO3_PYTHON=$(command -v python)" >> "$GITHUB_ENV"
          echo "FOUNDATION_NODE=$PWD/target/debug/foundation" >> "$GITHUB_ENV"
          mutants=$(cargo mutants --in-diff "$RUNNER_TEMP/diff.patch" --list \
            --shard "$SHARD/8" --sharding round-robin)
          if printf '%s\n' "$mutants" | grep -q '^sdk/python/'; then
            cargo build -p node --bin foundation
          fi
      - name: Mutants in the diff
        env:
          TMPDIR: ${{ runner.temp }}
          SHARD: ${{ matrix.shard }}
        run: |
          # A mutant can allocate in a loop. The cap leaves 3 GiB of the VM to the
          # runner agent, so the kernel kills the test, and the job reports the mutant.
          # The default OOMPolicy=stop would also stop cargo-mutants at that kill. A
          # hang waits 3 times the test time of the baseline, not the default 5: 4 jobs
          # on 4 cores can run slower than the baseline, so not lower. sudo drops
          # LD_LIBRARY_PATH, which the embedded CPython needs.
          cap=$(( $(awk '/^MemTotal:/ {print $2}' /proc/meminfo) - 3145728 ))K
          status=0
          sudo -E systemd-run --quiet --scope -p MemoryMax="$cap" -p MemorySwapMax=0 \
            -p OOMPolicy=continue --uid="$(id -u)" --gid="$(id -g)" -- \
            env "PATH=$PATH" "LD_LIBRARY_PATH=$LD_LIBRARY_PATH" \
            cargo mutants --in-diff "$RUNNER_TEMP/diff.patch" --jobs 4 \
            --shard "$SHARD/8" --sharding round-robin --timeout-multiplier 3 ||
            status=$?
          # A timeout is a mutant that made a test hang, so a test caught it. Exit 3
          # (timeout) wins over exit 2 (missed), so read the missed list too.
          if [ "$status" -eq 3 ] && [ ! -s mutants.out/missed.txt ]; then
            cat mutants.out/timeout.txt
            status=0
          fi
          exit "$status"

  # The required check. On a PR it passes when each shard passed. In the queue no shard
  # runs: it carries the result of this job at the head of the PR to the group.
  mutants:
    needs: [changes, mutants-shard]
    if: >-
      !cancelled() && needs.changes.outputs.rust != 'false' &&
      (github.event_name == 'pull_request' || github.event_name == 'merge_group')
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      contents: read
      checks: read
    steps:
      - if: github.event_name == 'pull_request'
        name: The result of the shards
        env:
          RESULT: ${{ needs.mutants-shard.result }}
        run: |
          [ "$RESULT" = success ] ||
            { echo "::error::The mutants shards ended in $RESULT."; exit 1; }
      - if: github.event_name == 'merge_group'
        uses: actions/checkout@v4
        with:
          # The check that runs is the one on the default branch, never the PR's.
          ref: ${{ github.event.repository.default_branch }}
      - if: github.event_name == 'merge_group'
        uses: Swatinem/rust-cache@v2
      - if: github.event_name == 'merge_group'
        name: The mutants result at the head of the PR
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          GROUP: ${{ github.event.merge_group.head_sha }}
        run: cargo xtask queue mutants "$GROUP"
