[package]
name = "home"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[features]
# Exposes `stored` and `split` to the benches, and `testing` to the tests of `home` and
# the crates above it.
sim = []

[dependencies]
block = { path = "../block" }
buffer = { path = "../buffer" }
clock = { path = "../clock" }
codec = { path = "../codec" }
control = { path = "../control" }
delivery = { path = "../delivery" }
env = { path = "../env" }
types = { path = "../types" }

[[bench]]
name = "split"
harness = false
test = true

[[bench]]
name = "stored"
harness = false
test = true

[lints]
workspace = true
