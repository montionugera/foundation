[package]
name = "sdk-python"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[lib]
name = "_native"
crate-type = ["cdylib"]
doctest = false

[features]
# Test-only functions of the module.
sim = []

[dependencies]
pyo3 = { version = "0.30.1", features = ["abi3-py311"] }
sdk = { path = "../rust" }
sector = { path = "../../crates/sector" }
types = { path = "../../crates/types" }

[dev-dependencies]
program = { path = "../../crates/program" }
transport = { path = "../../crates/transport" }

[lints]
workspace = true
