jobs:
  check:
    strategy:
      matrix:
        include:
          - name: check
            gates: []
          - name: macos
            gates: []
          - name: windows
            gates:
              - crates/g/src/lib.rs listed # #1
              - crates/g/src/lib.rs both # #1
